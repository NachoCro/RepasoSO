<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistemas Operativos: práctica</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6FA;--grid:#DCE4EE;--ink:#1B2A4A;--muted:#566884;--card:#fff;--line:#C4CFDE;--acc:#0E7C86;--accbg:#DDF1F2;--ok:#1B7F52;--okbg:#DFF3E8;--bad:#C0354C;--badbg:#FBE3E7;--hl:#F2C94C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101826;--grid:#1A2538;--ink:#E7EDF7;--muted:#9AABC6;--card:#172134;--line:#2B3A55;--acc:#4FC3CC;--accbg:#12353B;--ok:#5BD08F;--okbg:#14352A;--bad:#FF7A8E;--badbg:#3A1B24}}
:root[data-theme="dark"]{--bg:#101826;--grid:#1A2538;--ink:#E7EDF7;--muted:#9AABC6;--card:#172134;--line:#2B3A55;--acc:#4FC3CC;--accbg:#12353B;--ok:#5BD08F;--okbg:#14352A;--bad:#FF7A8E;--badbg:#3A1B24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.9rem;line-height:1.1;font-weight:800;margin:8px 0 4px}
h2{font-size:1.15rem;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tab{flex:1;padding:10px 12px;border:2px solid var(--ink);background:var(--card);border-radius:10px;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{padding:5px 12px;border:1.5px solid var(--line);background:var(--card);border-radius:99px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:12px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:18px;box-shadow:4px 4px 0 var(--ink)}
.q{font-size:1.15rem;font-weight:600;margin:0 0 14px}
.tag{display:inline-block;background:var(--hl);color:#1B2A4A;border-radius:6px;padding:1px 8px;font-size:.8rem;font-weight:600;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;margin-bottom:8px;border:2px solid var(--line);background:var(--bg);border-radius:10px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.fb{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--accbg)}
.main-btn{padding:10px 18px;border:2px solid var(--ink);background:var(--acc);color:#fff;border-radius:10px;font-weight:600}
.alt-btn{padding:10px 18px;border:2px solid var(--ink);background:var(--card);border-radius:10px;font-weight:600}
.big{font-size:2.6rem;font-weight:800;line-height:1}
table{border-collapse:collapse;margin:8px 0 12px}
th,td{border:1.5px solid var(--line);padding:5px 12px;text-align:center}
th{background:var(--accbg)}
.scroll{overflow-x:auto}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
label{display:flex;flex-direction:column;font-size:.9rem;color:var(--muted);flex:1 1 120px}
input{font:inherit;padding:8px 10px;margin-top:3px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
input.ok{border-color:var(--ok);background:var(--okbg)}
input.bad{border-color:var(--bad);background:var(--badbg)}
code{background:var(--accbg);padding:1px 6px;border-radius:5px}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<h1>Sistemas Operativos: práctica</h1>
<p class="sub">Unidades 4, 5 y 6 de UTN San Nicolás. Un quiz de opción múltiple y un ejercicio de paginación.</p>
<div class="tabs" role="tablist">
  <button class="tab" id="t1" role="tab" aria-selected="true">Quiz</button>
  <button class="tab" id="t2" role="tab" aria-selected="false">Ejercicio de paginación</button>
</div>

<section id="quiz">
  <div class="chips" id="chips"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="stats"><span id="st1"></span><span id="st2"></span></div>
  <div class="card" id="qbox"></div>
</section>

<section id="pag" hidden>
  <div class="card">
    <h2>Traducí la dirección lógica</h2>
    <div id="exInfo"></div>
    <div class="row">
      <label>Número de página (p)<input id="ip" inputmode="numeric" autocomplete="off"></label>
      <label>Desplazamiento (d)<input id="id" inputmode="numeric" autocomplete="off"></label>
      <label>Marco (f)<input id="if" inputmode="numeric" autocomplete="off"></label>
      <label>Dirección física<input id="iy" inputmode="numeric" autocomplete="off"></label>
    </div>
    <div class="row">
      <button class="main-btn" id="chk">Comprobar</button>
      <button class="alt-btn" id="sol">Ver solución</button>
      <button class="alt-btn" id="nw">Nuevo ejercicio</button>
    </div>
    <div class="fb" id="exFb" hidden></div>
    <p class="sub" id="exCount" style="margin:8px 0 0"></p>
  </div>
</section>
</main>

<script>
const G=(u,f)=>{f.u=u;return f};
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const fmt=n=>{let s=String(n),o='';while(s.length>3){o='.'+s.slice(-3)+o;s=s.slice(0,-3)}return s+o};
const hs=k=>k>=1073741824?k/1073741824+' TB':k>=1048576?k/1048576+' GB':k>=1024?k/1024+' MB':k+' KB';
const D=(c,a)=>{const s=[];a.forEach(x=>{if(x!==c&&x>=0&&!s.includes(x))s.push(x)});for(let k=1;s.length<3;k++){[c+k,c+k+1].forEach(x=>{if(s.length<3&&x!==c&&x>=0&&!s.includes(x))s.push(x)})}return s.slice(0,3)};
const N=(u,q,c,a,ex,f=fmt)=>[u,q,f(c),D(c,a).map(x=>f(x)),ex];
const Q=[
[4,"¿Qué es una condición de carrera?","El resultado depende del orden en que los procesos acceden a un dato compartido",["Dos procesos esperan para siempre un recurso del otro","Un proceso gira en un bucle consumiendo CPU","Un proceso termina antes que su padre"],"Con un dato compartido, manda quien escribe último y no la lógica: 5 + 1 − 1 puede dar 4, 5 o 6."],
[4,"¿Qué tres condiciones debe cumplir una solución al problema de la sección crítica?","Exclusión mutua, progreso y espera limitada",["Exclusión mutua, retención y espera, y espera circular","Progreso, sin desalojo y espera activa","Atomicidad, prioridad y apropiación"],"Solo uno adentro, la decisión no se posterga para siempre y nadie espera eternamente."],
[4,"¿Por qué falla la solución de Peterson en hardware moderno?","Porque CPU y compilador reordenan instrucciones y hay cachés por núcleo",["Porque solo funciona con 3 procesos","Porque necesita semáforos para andar","Porque los procesos no pueden compartir memoria"],"Si turn se escribe antes que flag, los dos procesos pueden entrar a la sección crítica."],
[4,"test_and_set y compare_and_swap dan exclusión mutua, pero no garantizan...","Espera limitada (puede haber inanición)",["Que la operación sea atómica","Que el cerrojo se pueda tomar","Que funcionen en multinúcleo"],"Un proceso puede perder siempre la carrera por el lock mientras otros lo toman una y otra vez."],
G(4,()=>{const s=R(4,9),w=R(2,s-1),g=R(1,3),v=s-w+g;return N(4,'Un semáforo contador arranca en '+s+'. Se ejecutan '+w+' wait() y '+g+' signal(). ¿Cuánto vale?',v,[s,s-w,s+g,s-w-g],'Cada wait resta 1 y cada signal suma 1: '+s+' − '+w+' + '+g+' = '+v+'.',String)}),
[4,"¿Cuál NO es una de las 4 condiciones necesarias del deadlock?","Espera activa (busy waiting)",["Exclusión mutua","Retención y espera","Espera circular"],"Las cuatro son: exclusión mutua, retención y espera, sin desalojo y espera circular."],
[4,"En la solución simple de los filósofos con un semáforo por palillo, ¿cómo se produce el deadlock?","Los 5 toman a la vez el palillo izquierdo y todos esperan el derecho",["Dos filósofos toman el mismo palillo","Un filósofo come sin soltar nunca los palillos","Los semáforos se inicializan en 0 por error"],"Todos los palillos quedan en 0 y nadie suelta nada: espera circular."],
[5,"¿Qué elimina la paginación?","La fragmentación externa",["La fragmentación interna","La tabla de páginas","La necesidad de la MMU"],"Páginas y marcos tienen el mismo tamaño, así que no hacen falta huecos grandes. Queda algo de fragmentación interna en la última página."],
[5,"¿Para qué sirve el TLB?","Es una caché de traducciones que evita el doble acceso a memoria",["Guarda las páginas que están en disco","Reemplaza a la tabla de páginas","Calcula el desplazamiento d"],"Con TLB hit se evita consultar la tabla de páginas en RAM; con miss se consulta y se actualiza el TLB."],
[5,"¿Cuándo se produce un page fault?","Cuando el proceso accede a una página cuyo bit es inválido porque no está en RAM",["Cuando la RAM se queda sin energía","Cuando dos procesos escriben la misma página","Cuando el TLB tiene un hit"],"El hardware hace un trap, el SO trae la página del disco, actualiza la tabla y reinicia la instrucción."],
[5,"¿Qué es la anomalía de Belady?","Con FIFO, dar más marcos puede producir más page faults",["Con LRU, más marcos siempre dan más fallos","El thrashing aumenta con más RAM","OPT falla con cadenas largas"],"Pasa con FIFO (por ejemplo 3 marcos = 9 fallos y 4 marcos = 10). LRU y OPT no la sufren."],
[5,"¿Qué es el thrashing?","El sistema pasa más tiempo paginando que ejecutando instrucciones",["Un proceso se queda sin CPU por prioridad","La RAM se llena de páginas limpias","El disco se queda sin espacio"],"Se corrige con el working set: si la demanda total supera los marcos, se baja la multiprogramación."],
[5,"En copy-on-write, tras un fork, ¿cuándo se copia una página?","Cuando alguno de los procesos intenta escribirla",["En el momento del fork","Cuando el hijo hace exec","Nunca, se comparten siempre"],"Mientras solo se lee, padre e hijo comparten los marcos. Al escribir, el SO copia solo esa página."],
G(5,()=>{const r=[100,200][R(0,1)],p=[0.001,0.002,0.005,0.01,0.02][R(0,4)],v=Math.round((1-p)*r+p*8e6),k=Math.round(v/r);return N(5,'RAM de '+r+' ns, page fault de 8 ms y p = '+String(p).replace('.',',')+'. ¿Cuánto vale aproximadamente el EAT?',v,[r,Math.round(p*8e6),v*10,Math.round(v/10)],'EAT = (1 − p) × '+r+' + p × 8.000.000 ≈ '+fmt(v)+' ns: unas '+k+' veces más lento que la RAM.',x=>'≈ '+fmt(x)+' ns')}),
[6,"Se borra el archivo original. ¿Qué pasa con un hard link y con un soft link a él?","El hard link sigue funcionando y el soft link queda roto",["Ambos siguen funcionando","Ambos quedan rotos","El soft link sigue y el hard link queda roto"],"El hard link apunta al mismo inodo y el archivo vive mientras quede una entrada. El soft link guarda solo la ruta."],
G(6,()=>{const B=[1,2,4,8][R(0,3)],c=12*B;return N(6,'Con bloques de '+B+' KB, ¿cuánto direccionan los 12 punteros directos del inodo?',c,[15*B,10*B,13*B,c*2],'12 × '+B+' KB = '+c+' KB. Los indirectos agregan capacidad para archivos grandes.',x=>x+' KB')}),
[6,"En una transferencia por DMA, ¿cuántas interrupciones genera la controladora?","Una sola, al terminar el bloque completo",["Una por cada byte transferido","Ninguna","Una por cada página"],"La controladora de DMA copia entre dispositivo y RAM sin la CPU y avisa una vez al final."],
G(6,()=>{const B=[1024,2048,4096][R(0,2)];let z;do{z=R(1500,20000)}while(z%B===0);const k=Math.ceil(z/B),t=k*B,w=t-z;return N(6,'Un archivo de '+fmt(z)+' bytes en bloques de '+fmt(B)+' bytes: ¿cuántos bytes se desperdician?',w,[z%B,B,t,Math.floor(w/2)],'Ocupa '+k+' bloques ('+fmt(t)+' B): '+fmt(t)+' − '+fmt(z)+' = '+fmt(w)+' B de fragmentación interna.')}),
[4,"¿Qué hace un spinlock?","El proceso espera en un bucle consumiendo CPU hasta conseguir el lock",["Duerme al proceso hasta que alguien lo despierte","Reserva varias instancias de un recurso","Reordena instrucciones para evitar carreras"],"Es espera activa (busy wait): gasta ciclos, pero evita el cambio de contexto."],
[4,"¿Por qué un spinlock es mala idea en una máquina de un solo núcleo?","El proceso que gira impide que otro libere el lock hasta que el planificador lo saque de la CPU",["Porque no puede tomar el lock","Porque wait() necesita dos núcleos","Porque siempre produce deadlock"],"En multinúcleo sirve si el lock se libera enseguida, porque otro núcleo puede liberarlo mientras el primero gira."],
[4,"Hay un pool de 5 impresoras idénticas. ¿Qué semáforo conviene?","Un semáforo contador inicializado en 5",["Un semáforo binario inicializado en 1","Un mutex","Un semáforo contador inicializado en 0"],"El contador arranca en la cantidad de recursos: wait() al tomar una y signal() al devolverla."],
[4,"Para que D2 (de P2) corra solo después de D1 (de P1), ¿cómo se usa el semáforo compartido?","Arranca en 0: P1 hace signal tras D1 y P2 hace wait antes de D2",["Arranca en 1 y ambos hacen wait","Arranca en 0: P2 hace signal y P1 hace wait","Arranca en N, con N la cantidad de procesos"],"Con 0, P2 se bloquea en el wait hasta que P1 hace signal. Es sincronización de orden."],
[4,"¿Qué hace wait() sobre una variable de condición dentro de un monitor?","Suspende al proceso y libera el monitor",["Bloquea el monitor hasta que el proceso termine","Despierta a un proceso que esperaba","Reinicia el contador del monitor"],"Si no liberara el monitor, el productor no podría entrar a producir y se bloquearían los dos."],
[4,"¿Qué ventaja tiene un monitor frente a los semáforos?","La exclusión mutua es automática: solo un hilo está activo adentro",["Permite varios hilos activos a la vez","No necesita variables de condición","Usa instrucciones atómicas más rápidas"],"No se puede olvidar un wait() o un signal() para la exclusión mutua, que es lo que rompe todo con semáforos."],
G(4,()=>{const n=R(5,16);return N(4,'Buffer circular con in y out y BUFFER_SIZE = '+n+'. ¿Cuántos elementos se pueden guardar?',n-1,[n,n-2,n+1],'Se desperdicia una posición: si se llenara todo, in == out y no se distinguiría lleno de vacío. Caben '+n+' − 1 = '+(n-1)+'.',String)}),
[4,"¿Qué ventaja tiene un kernel apropiativo?","Mejor tiempo de respuesta y es apto para tiempo real",["Está libre de condiciones de carrera en sus estructuras","Es más simple de programar","No necesita sincronización"],"Pero no está libre de carreras: necesita sincronización. Lo usan Linux, Windows NT y macOS."],
[4,"En un RAG con un ciclo y UNA instancia por recurso, ¿qué hay?","Un deadlock seguro",["Solo la posibilidad de deadlock","Un sistema seguro","Inanición pero no deadlock"],"Cada recurso con una sola instancia convierte el ciclo en certeza de deadlock."],
[4,"En un RAG con un ciclo y VARIAS instancias por recurso, ¿qué se puede afirmar?","Existe la posibilidad de deadlock, pero no es seguro",["Hay deadlock seguro","No hay deadlock","El grafo no sirve en ese caso"],"Un proceso fuera del ciclo podría liberar una instancia y deshacer el ciclo."],
[4,"Numerar los recursos y pedirlos siempre en orden creciente previene el deadlock porque rompe...","La espera circular",["La exclusión mutua","La retención y espera","La condición de sin desalojo"],"Si todos piden en orden creciente, no puede formarse la cadena P0 → P1 → ... → P0."],
[4,"Un estado es seguro cuando...","Existe una secuencia en la que todos los procesos pueden terminar",["No hay procesos esperando","Hay al menos un recurso libre de cada tipo","Ningún proceso retiene recursos"],"Inseguro no significa deadlock, pero puede llevar a uno. El algoritmo del banquero solo concede si el estado sigue siendo seguro."],
G(5,()=>{const b=R(10,90)*10000+R(0,9)*40,l=R(5,40)*1000+R(0,9)*100,c=b+l-1;return N(5,'Base = '+fmt(b)+' y límite = '+fmt(l)+'. ¿Cuál es la última dirección legal?',c,[c+1,b+l+1000,b],'Es válida si base ≤ dirección < base + límite, o sea hasta '+fmt(b)+' + '+fmt(l)+' − 1 = '+fmt(c)+'.')}),
G(5,()=>{const r=R(5,40)*1000,d=R(100,999),c=r+d;return N(5,'Registro de reubicación = '+fmt(r)+'. La CPU genera la dirección lógica '+d+'. ¿Qué dirección física produce la MMU?',c,[d,r-d,r+d+1000],'La MMU suma el registro de reubicación a cada dirección lógica: '+fmt(r)+' + '+d+' = '+fmt(c)+'.')}),
[5,"¿Qué se necesita para poder compactar la memoria?","Reubicación dinámica en tiempo de ejecución",["Que los procesos estén en disco","Enlace de direcciones en compilación","Tablas de páginas invertidas"],"Hay que mover procesos y que sigan funcionando: por eso el registro de reubicación de la MMU."],
G(5,()=>{const m=R(12,32),n=R(10,Math.min(14,m-2));return N(5,'Espacio lógico de 2^'+m+' y páginas de 2^'+n+' bytes. ¿Cuántos bits ocupa el número de página?',m-n,[n,m,m-n+2,m-n-1],'p ocupa m − n bits = '+m+' − '+n+' = '+(m-n)+', y d ocupa n = '+n+' bits.',String)}),
G(5,()=>{const S=[4,8,16][R(0,2)],a=R(S+1,S*8-1),p=Math.floor(a/S),d=a%S,f=(x,y)=>x+', con desplazamiento '+y,c=f(p,d),w=[f(a,0),f(d,p),f(p+1,d),f(p,d+1),f(p+2,d)].filter((x,i,ar)=>x!==c&&ar.indexOf(x)===i).slice(0,3);return [5,'Páginas de '+S+' bytes. La dirección lógica '+a+' está en la página...',c,w,'Se divide la dirección por el tamaño de página: '+a+' = '+p+' × '+S+' + '+d+', entonces p = '+p+' y d = '+d+'.']}),
[5,"¿Qué esquema sufre fragmentación externa?","Segmentación",["Paginación","Ambos por igual","Ninguno"],"Los segmentos tienen tamaño variable y dejan huecos. La paginación solo tiene fragmentación interna."],
[5,"Una página víctima con dirty bit = 0...","Se descarta sin escribirla en disco",["Se escribe en disco antes de liberar el marco","Se copia al TLB","Se marca como válida de nuevo"],"No fue modificada, la copia del disco sigue vigente: se ahorra una escritura."],
[5,"En el algoritmo del reloj, al revisar una página con R = 1...","Pasa a R = 0 y recibe una segunda oportunidad",["Se elige como víctima","Se escribe en disco","Se mueve al principio de la cola"],"Solo se reemplaza una página con R = 0."],
[5,"¿LRU sufre la anomalía de Belady?","No",["Sí, siempre","Solo con 3 marcos","Solo si hay dirty bits"],"LRU y OPT no la sufren. FIFO sí."],
[5,"¿Por qué OPT no se puede implementar en la práctica?","Requiere conocer las referencias futuras",["Necesita demasiada memoria","Solo funciona con un marco","Siempre produce thrashing"],"Se usa como referencia: da la menor tasa de fallos posible para comparar FIFO, LRU o Reloj."],
[5,"Si la demanda total de marcos (suma de los working sets) supera los marcos disponibles, el SO...","Reduce la multiprogramación y suspende procesos",["Aumenta el tamaño de página","Admite más procesos para usar la CPU","Desactiva el TLB"],"Más procesos solo empeoran el thrashing: faltan marcos y suben los page faults."],
G(5,()=>{let s;do{s=R(5,120)}while((s&(s-1))===0);let b=1;while(b<s)b*=2;return N(5,'El kernel pide '+s+' KB al Buddy System. ¿Qué bloque recibe?',b,[s,b/2,b*2,s+(b-s>2?2:1)],'Se redondea a la siguiente potencia de 2 ('+b+' KB) y sobran '+(b-s)+' KB de fragmentación interna.',x=>x+' KB')}),
[5,"¿Qué reduce el slab allocation respecto del Buddy System?","La fragmentación interna",["La fragmentación externa de los procesos de usuario","El tamaño de la tabla de páginas","La tasa de page faults"],"Las cachés tienen espacios del tamaño justo de cada objeto del kernel."],
G(5,()=>{const n=R(3,9);let m,r;do{m=R(50,150);r=m%n}while(!r);const q=Math.floor(m/n);return N(5,'Con '+m+' marcos y '+n+' procesos, la asignación equitativa da '+q+' marcos a cada uno. ¿Cuántos sobran?',r,[q,n,n-1,n+1],m+' = '+n+' × '+q+' + '+r+'. Los '+r+' restantes pueden quedar como reserva de marcos libres.',String)}),
[6,"¿Para qué sirve open()?","Busca el archivo una vez, verifica permisos y devuelve un file descriptor",["Borra los bloques del archivo","Copia el archivo completo a RAM","Crea una entrada en el directorio"],"Evita recorrer directorios en cada read() o write()."],
[6,"¿Qué hace lseek()?","Reubica el file offset sin leer ni escribir",["Lee el siguiente bloque","Trunca el archivo","Cierra el descriptor"],"Habilita el acceso directo o aleatorio."],
[6,"¿Qué tabla de archivos abiertos lleva el open_count?","La tabla global del sistema",["La tabla local del proceso","El inodo en disco","El directorio raíz"],"Los metadatos se liberan cuando el contador llega a cero tras los close()."],
[6,"¿Qué tipo de bloqueo de archivos usa UNIX/Linux por defecto?","De aviso (advisory)",["Obligatorio (mandatory)","Exclusivo del kernel","Ninguno"],"Los programas deben respetarlo. En Windows el predeterminado es el obligatorio."],
[6,"En un directorio, el permiso x permite...","Entrar al directorio y atravesar la ruta",["Listar su contenido","Borrar archivos","Ejecutar todos los archivos que contiene"],"En directorios: r lista, w crea o borra y x permite entrar (cd)."],
[6,"¿Qué desventaja tiene la asignación enlazada con FAT?","Acceso aleatorio lento y mucha RAM para la FAT",["Fragmentación externa severa","Hay que conocer el tamaño final","No permite que el archivo crezca"],"Elimina la fragmentación externa, pero navegar la cadena de punteros es lento."],
G(6,()=>{const B=[1,2,4,8][R(0,3)],P=[4,8][R(0,1)],n=B*1024/P,c=n*n*B;return N(6,'Con bloques de '+B+' KB y punteros de '+P+' bytes, ¿cuánto direcciona el indirecto doble del inodo?',c,[n*B,n*n*n*B,c*2,c/2],'Cada bloque de índice guarda '+B+' KB / '+P+' B = '+fmt(n)+' punteros. Indirecto doble: '+fmt(n)+' × '+fmt(n)+' × '+B+' KB = '+hs(c)+'.',hs)}),
[6,"¿Qué ocurre en la primera lectura de una región mapeada con mmap?","Un page fault: el kernel trae el bloque del disco a un marco",["Se copia todo el archivo a RAM al llamar mmap()","Se llama a read() en cada acceso","Se bloquea el archivo para otros procesos"],"Después se accede a velocidad de RAM sin pasar por el kernel."],
G(6,()=>{const h=R(10,150),k=R(6,8),q=[];while(q.length<k){const x=R(0,199);if(x!==h&&!q.includes(x))q.push(x)}let c=h,t=0;const tm=[];q.forEach(x=>{const d=Math.abs(x-c);tm.push(d);t+=d;c=x});const rest=q.slice();let c2=h,s=0;while(rest.length){let bi=0;rest.forEach((x,i)=>{if(Math.abs(x-c2)<Math.abs(rest[bi]-c2))bi=i});s+=Math.abs(rest[bi]-c2);c2=rest[bi];rest.splice(bi,1)}return N(6,'Cabezal en '+h+' y cola '+q.join(', ')+'. ¿Cuántos cilindros recorre FCFS?',t,[s,t+R(10,40),t-R(10,40),Math.max(...q)-Math.min(...q)],'FCFS atiende en orden de llegada y suma las distancias: '+tm.join(' + ')+' = '+t+'. SSTF recorrería '+s+' con esta cola, pero puede dejar sin atender a las solicitudes lejanas.')}),
[6,"¿Qué hace RAID 1?","Duplica cada disco (espejo)",["Reparte los datos en bandas sin redundancia","Usa solo paridad","Comprime los datos"],"RAID 0 reparte (striping) y RAID 1 espeja (mirroring)."],
[6,"¿Para qué sirve el spooling?","Para encolar la salida de dispositivos que no admiten E/S intercalada, como la impresora",["Para acelerar el TLB","Para compactar la memoria","Para duplicar discos"],"Los trabajos se guardan en una cola y se imprimen uno por uno, sin mezclarse."]
];
const $=s=>document.querySelector(s);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=n=>Math.floor(Math.random()*n);

// Pestañas
function tab(n){
  $("#quiz").hidden=n!==1;$("#pag").hidden=n!==2;
  $("#t1").setAttribute("aria-selected",n===1);$("#t2").setAttribute("aria-selected",n===2);
}
$("#t1").onclick=()=>tab(1);$("#t2").onclick=()=>tab(2);

// Quiz
let filt=0,order=[],qi=0,score=0,streak=0,best=0,done=false;
function chips(){
  $("#chips").innerHTML="";
  [["Todas",0],["Unidad 4",4],["Unidad 5",5],["Unidad 6",6]].forEach(([t,v])=>{
    const b=document.createElement("button");b.className="chip";b.textContent=t;
    b.setAttribute("aria-pressed",filt===v);b.onclick=()=>{filt=v;start()};$("#chips").appendChild(b);
  });
}
function start(){
  const pool=Q.filter(q=>!filt||(typeof q==="function"?q.u:q[0])===filt);
  order=shuffle(pool.slice()).slice(0,50).map(q=>typeof q==="function"?q():q);qi=0;score=0;streak=0;best=0;chips();show();
}
function stats(){
  $("#bar").style.width=(qi/order.length*100)+"%";
  $("#st1").textContent="Pregunta "+Math.min(qi+1,order.length)+" de "+order.length;
  $("#st2").textContent="Aciertos: "+score+" | Racha: "+streak;
}
function show(){
  stats();done=false;
  if(qi>=order.length){return result()}
  const q=order[qi],opts=shuffle([q[2],...q[3]]);
  const box=$("#qbox");
  box.innerHTML='<span class="tag">Unidad '+q[0]+'</span><p class="q"></p><div id="opts"></div><div class="fb" id="fb" hidden></div><button class="main-btn" id="nx" hidden>Siguiente</button>';
  box.querySelector(".q").textContent=q[1];
  opts.forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o;
    b.onclick=()=>answer(b,o===q[2],q);$("#opts").appendChild(b);
  });
}
function answer(btn,ok,q){
  if(done)return;done=true;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===q[2])b.classList.add("ok")});
  if(ok){score++;streak++;best=Math.max(best,streak)}else{btn.classList.add("bad");streak=0}
  const fb=$("#fb");fb.hidden=false;fb.textContent=(ok?"¡Correcto! ":"No es esa. ")+q[4];
  const nx=$("#nx");nx.hidden=false;nx.textContent=qi+1>=order.length?"Ver resultado":"Siguiente";
  nx.onclick=()=>{qi++;show()};nx.focus();stats();
}
function result(){
  $("#bar").style.width="100%";
  const p=Math.round(score/order.length*100);
  const msg=p===100?"Perfecto. Podés rendir mañana.":p>=70?"Muy bien. Repasá las que fallaste.":p>=40?"Vas por buen camino. Una vuelta más al resumen.":"Hay que repasar. Volvé al resumen y reintentá.";
  $("#qbox").innerHTML='<p class="big">'+score+" / "+order.length+'</p><p class="q" style="margin-top:8px">'+msg+'</p><p class="sub">Mejor racha: '+best+'</p><button class="main-btn" id="again">Jugar otra ronda</button>';
  $("#again").onclick=start;$("#again").focus();
}

// Ejercicio de paginación
let ex=null,solved=0,tries=0;
function newEx(){
  const m=6,n=[2,3][rnd(2)],P=1<<(m-n),S=1<<n;
  const frames=shuffle(Array.from({length:P*2},(_,i)=>i)).slice(0,P);
  const addr=rnd(1<<m),p=addr>>n,d=addr&(S-1),f=frames[p];
  ex={m,n,P,S,frames,addr,p,d,f,phys:f*S+d};
  let t='<p>Espacio lógico de <code>2<sup>'+m+'</sup> = '+(1<<m)+'</code> direcciones y páginas de <code>2<sup>'+n+'</sup> = '+S+'</code> bytes. La memoria física tiene '+(P*2)+' marcos.</p><div class="scroll"><table><tr><th>Página</th>';
  frames.forEach((_,i)=>t+="<td>"+i+"</td>");t+="</tr><tr><th>Marco</th>";
  frames.forEach(x=>t+="<td>"+x+"</td>");
  t+="</tr></table></div><p>Dirección lógica: <strong style=\"font-size:1.4rem\">"+addr+"</strong></p>";
  $("#exInfo").innerHTML=t;
  ["ip","id","if","iy"].forEach(i=>{const e=$("#"+i);e.value="";e.className=""});
  $("#exFb").hidden=true;tries=0;$("#exCount").textContent="Resueltos: "+solved;$("#ip").focus();
}
function check(){
  const v={ip:ex.p,id:ex.d,if:ex.f,iy:ex.phys};let all=true;
  for(const k in v){
    const e=$("#"+k),val=e.value.trim();
    if(val===""){e.className="";all=false;continue}
    const good=Number(val)===v[k];e.className=good?"ok":"bad";if(!good)all=false;
  }
  tries++;const fb=$("#exFb");fb.hidden=false;
  if(all){solved++;fb.textContent="¡Todo correcto! Armá otro con “Nuevo ejercicio”.";$("#exCount").textContent="Resueltos: "+solved}
  else fb.textContent="Revisá los campos marcados en rojo. Pista: p y d salen de dividir la dirección lógica por el tamaño de página; el desplazamiento no cambia al traducir."+(tries>=2?" Si te trabás, mirá la solución.":"");
}
function solution(){
  const bin=ex.addr.toString(2).padStart(ex.m,"0"),a=bin.slice(0,ex.m-ex.n),b=bin.slice(ex.m-ex.n);
  ["ip","id","if","iy"].forEach((k,i)=>{const e=$("#"+k);e.value=[ex.p,ex.d,ex.f,ex.phys][i];e.className="ok"});
  const fb=$("#exFb");fb.hidden=false;
  fb.innerHTML="<strong>Paso a paso</strong><br>1. Con "+ex.m+" bits lógicos y páginas de 2<sup>"+ex.n+"</sup>, p usa "+(ex.m-ex.n)+" bits y d usa "+ex.n+" bits.<br>2. "+ex.addr+" = ("+bin+")<sub>2</sub> = ("+a+" | "+b+")<sub>2</sub>, entonces p = "+ex.p+" y d = "+ex.d+".<br>3. La tabla dice: página "+ex.p+" → marco "+ex.f+".<br>4. Dirección física = "+ex.f+" × "+ex.S+" + "+ex.d+" = <strong>"+ex.phys+"</strong>.";
}
$("#chk").onclick=check;$("#sol").onclick=solution;$("#nw").onclick=newEx;
["ip","id","if","iy"].forEach(i=>$("#"+i).addEventListener("keydown",e=>{if(e.key==="Enter")check()}));

start();newEx();
</script>
